org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# R8 full mode: knekker ML Kit GenAI (beta) uten utvidede keep-regler.
# Ved å aktivere dette og legge til de nødvendige reglene i
# proguard-rules.pro, får vi mindre og raskere release-bygg uten å miste
# on-device AI-støtte.
android.enableR8.fullMode=true
# Kotlin incremental compilation krasjer med "Storage already registered" /
# "different roots" pga. gammel kompilatordaemon-tilstand fra tidligere
# feilede bygg. Deaktivert for stabilitet; bygg blir noe tregere.
kotlin.incremental=false
